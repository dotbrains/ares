profile: basic
plugins:
  enabled:
    - ssh-hardening
    - firewall-ufw
    - fail2ban
    - unattended-upgrades
    - sysctl-baseline
  custom:
    - name: tailscale-ssh
      probe: command -v tailscale
      plan: ares-plugin-tailscale-ssh plan
      apply: ares-plugin-tailscale-ssh apply
      rollback: ares-plugin-tailscale-ssh rollback
