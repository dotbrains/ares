id = "pacman-upgrade"
name = "pacman upgrade"
kind = "builtin"
behavior = "security-updates"
behavior_variant = "pacman"
verifier = "command"
summary = "Applies Arch Linux package upgrades through pacman"
categories = ["updates", "hardening"]
requires = ["pacman"]
capabilities = ["security-updates"]
distros = ["arch"]
probe = "command -v pacman"
plan = "builtin:pacman-upgrade:plan"
apply = "builtin:pacman-upgrade:apply"
rollback = "builtin:pacman-upgrade:rollback"
config = """
[plugins]
enabled = ["pacman-upgrade"]
"""
