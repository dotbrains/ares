id = "dnf-automatic"
name = "dnf-automatic"
kind = "builtin"
summary = "Enables dnf automatic security updates without automatic reboots"
categories = ["updates", "hardening"]
requires = ["dnf"]
capabilities = ["security-updates"]
distros = ["almalinux", "rocky", "rhel", "fedora", "ol", "oracle", "amzn", "amazon"]
probe = "rpm -q dnf-automatic"
plan = "builtin:dnf-automatic:plan"
apply = "builtin:dnf-automatic:apply"
rollback = "builtin:dnf-automatic:rollback"
managed_files = ["/etc/dnf/automatic.conf"]
backup_files = ["/etc/dnf/automatic.conf"]
rollback_steps = ["restore /etc/dnf/automatic.conf backup"]
config = """
[plugins]
enabled = ["dnf-automatic"]
"""
