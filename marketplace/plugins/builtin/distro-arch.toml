id = "distro-arch"
name = "Arch Linux adapter"
kind = "builtin"
summary = "Provides pacman, systemd, SSH, and service defaults for Arch Linux VPS hosts"
categories = ["distro"]
capabilities = ["package-manager", "service-manager", "ssh-service"]
distros = ["arch"]
package_manager = "pacman"
init_system = "systemd"
firewall_backend = "nftables"
ssh_service = "sshd"
probe = "grep -q '^ID=arch' /etc/os-release"
plan = "builtin:distro-arch:plan"
apply = "builtin:distro-arch:apply"
rollback = "builtin:distro-arch:rollback"
config = """
[plugins]
enabled = ["distro-arch"]
"""
