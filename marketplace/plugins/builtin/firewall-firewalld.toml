id = "firewall-firewalld"
name = "firewalld firewall"
kind = "builtin"
behavior = "firewall"
verifier = "firewall"
summary = "Configures firewalld with safe VPS defaults"
categories = ["firewall", "network"]
requires = ["dnf|yum|zypper"]
capabilities = ["firewall"]
distros = ["almalinux", "rocky", "rhel", "fedora", "ol", "oracle", "amzn", "amazon", "opensuse-leap"]
probe = "command -v firewall-cmd"
plan = "builtin:firewall-firewalld:plan"
apply = "builtin:firewall-firewalld:apply"
rollback = "builtin:firewall-firewalld:rollback"
config = """
[plugins]
enabled = ["firewall-firewalld"]
"""
