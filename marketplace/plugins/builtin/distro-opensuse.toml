id = "distro-opensuse"
name = "openSUSE Leap adapter"
kind = "builtin"
behavior = "distro"
verifier = "none"
summary = "Provides zypper, systemd, SSH, and service defaults for openSUSE Leap VPS hosts"
categories = ["distro"]
capabilities = ["package-manager", "service-manager", "ssh-service"]
distros = ["opensuse-leap"]
package_manager = "zypper"
init_system = "systemd"
firewall_backend = "firewalld"
ssh_service = "sshd"
probe = "grep -q '^ID=opensuse-leap' /etc/os-release"
plan = "builtin:distro-opensuse:plan"
apply = "builtin:distro-opensuse:apply"
rollback = "builtin:distro-opensuse:rollback"
config = """
[plugins]
enabled = ["distro-opensuse"]
"""
