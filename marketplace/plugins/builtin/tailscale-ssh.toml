id = "tailscale-ssh"
aliases = ["tailscale"]
name = "Tailscale SSH"
kind = "builtin"
summary = "Installs and enables tailscaled, then records explicit tailnet SSH setup guidance"
categories = ["network", "ssh", "tailscale"]
requires = ["package-manager", "service-manager"]
capabilities = ["tailscale-ssh"]
behavior = "tailscale-ssh"
verifier = "command"
probe = "true"
plan = "builtin:tailscale-ssh:plan"
apply = "builtin:tailscale-ssh:apply"
verify = "builtin:tailscale-ssh:verify"
rollback = "builtin:tailscale-ssh:rollback"
rollback_steps = ["review Tailscale SSH state with tailscale status", "disable Tailscale SSH with tailscale up --ssh=false if it was enabled manually", "disable tailscaled with systemctl disable --now tailscaled if Tailscale is no longer needed"]
config = """
[plugins]
enabled = ["tailscale-ssh"]

[tailscale]
ssh_enabled = true
auth_key_env = "TAILSCALE_AUTHKEY"
"""
