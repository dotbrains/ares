id = "strict-profile"
name = "Strict profile"
kind = "builtin"
behavior = "strict-profile"
verifier = "path"
summary = "Applies stricter fail2ban defaults and optional root lockout guidance"
categories = ["profile", "hardening"]
requires = ["fail2ban", "ssh-hardening"]
capabilities = ["profile-strict"]
probe = "true"
plan = "builtin:strict-profile:plan"
apply = "builtin:strict-profile:apply"
rollback = "builtin:strict-profile:rollback"
managed_files = ["/etc/fail2ban/jail.d/ares-sshd.conf"]
rollback_steps = ["review root account lockout guidance"]
config = """
profile = "strict"
"""
