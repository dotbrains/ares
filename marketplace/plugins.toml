[[plugins]]
id = "distro-debian"
name = "Debian adapter"
kind = "builtin"
summary = "Provides apt, systemd, SSH, and service defaults for Debian VPS hosts"
categories = ["distro"]
capabilities = ["package-manager", "service-manager", "ssh-service"]
distros = ["debian"]
probe = "test -f /etc/debian_version"
plan = "builtin:distro-debian:plan"
apply = "builtin:distro-debian:apply"
rollback = "builtin:distro-debian:rollback"
config = """
[plugins]
enabled = ["distro-debian"]
"""

[[plugins]]
id = "distro-ubuntu"
name = "Ubuntu adapter"
kind = "builtin"
summary = "Provides apt, systemd, SSH, and service defaults for Ubuntu VPS hosts"
categories = ["distro"]
capabilities = ["package-manager", "service-manager", "ssh-service"]
distros = ["ubuntu"]
probe = "grep -q '^ID=ubuntu' /etc/os-release"
plan = "builtin:distro-ubuntu:plan"
apply = "builtin:distro-ubuntu:apply"
rollback = "builtin:distro-ubuntu:rollback"
config = """
[plugins]
enabled = ["distro-ubuntu"]
"""

[[plugins]]
id = "distro-rhel"
name = "RHEL-family adapter"
kind = "builtin"
summary = "Provides dnf, systemd, SSH, and service defaults for AlmaLinux and Rocky Linux"
categories = ["distro"]
capabilities = ["package-manager", "service-manager", "ssh-service"]
distros = ["almalinux", "rocky", "rhel"]
probe = "test -f /etc/redhat-release"
plan = "builtin:distro-rhel:plan"
apply = "builtin:distro-rhel:apply"
rollback = "builtin:distro-rhel:rollback"
config = """
[plugins]
enabled = ["distro-rhel"]
"""

[[plugins]]
id = "distro-fedora"
name = "Fedora adapter"
kind = "builtin"
summary = "Provides dnf, systemd, SSH, and service defaults for Fedora Server"
categories = ["distro"]
capabilities = ["package-manager", "service-manager", "ssh-service"]
distros = ["fedora"]
probe = "grep -q '^ID=fedora' /etc/os-release"
plan = "builtin:distro-fedora:plan"
apply = "builtin:distro-fedora:apply"
rollback = "builtin:distro-fedora:rollback"
config = """
[plugins]
