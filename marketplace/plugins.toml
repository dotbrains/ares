[[plugins]]
id = "ssh-hardening"
name = "SSH hardening"
kind = "builtin"
summary = "Writes a managed sshd drop-in after preserving the active SSH port"
categories = ["ssh", "hardening"]
requires = ["ssh-service"]
capabilities = ["ssh-hardening"]
probe = "test -d /etc/ssh"
plan = "builtin:ssh-hardening:plan"
apply = "builtin:ssh-hardening:apply"
rollback = "builtin:ssh-hardening:rollback"
config = """
[plugins]
enabled = ["ssh-hardening"]
"""

[[plugins]]
id = "firewall-ufw"
name = "UFW firewall"
kind = "builtin"
summary = "Configures UFW with safe VPS defaults"
categories = ["firewall", "network"]
requires = ["apt-get"]
capabilities = ["firewall"]
distros = ["ubuntu", "debian"]
probe = "command -v ufw"
plan = "builtin:firewall-ufw:plan"
apply = "builtin:firewall-ufw:apply"
rollback = "builtin:firewall-ufw:rollback"
config = """
[plugins]
enabled = ["firewall-ufw"]
"""

[[plugins]]
id = "firewall-firewalld"
name = "firewalld firewall"
kind = "builtin"
summary = "Configures firewalld with safe VPS defaults"
categories = ["firewall", "network"]
requires = ["dnf"]
capabilities = ["firewall"]
distros = ["almalinux", "rocky", "rhel", "fedora"]
probe = "command -v firewall-cmd"
plan = "builtin:firewall-firewalld:plan"
apply = "builtin:firewall-firewalld:apply"
rollback = "builtin:firewall-firewalld:rollback"
config = """
[plugins]
enabled = ["firewall-firewalld"]
"""

[[plugins]]
id = "firewall-nftables"
