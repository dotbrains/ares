[[plugins]]
id = "fail2ban"
aliases = ["intrusion-protection"]
name = "fail2ban"
kind = "builtin"
summary = "Installs and enables fail2ban with conservative SSH jail defaults"
categories = ["ssh", "hardening"]
capabilities = ["fail2ban"]
probe = "command -v fail2ban-client"
plan = "builtin:fail2ban:plan"
apply = "builtin:fail2ban:apply"
rollback = "builtin:fail2ban:rollback"
config = """
[plugins]
enabled = ["fail2ban"]
"""

[[plugins]]
id = "unattended-upgrades"
aliases = ["security-updates"]
name = "unattended-upgrades"
kind = "builtin"
summary = "Enables apt automatic security updates without automatic reboots"
categories = ["updates", "hardening"]
requires = ["apt-get"]
capabilities = ["security-updates"]
distros = ["ubuntu", "debian"]
probe = "dpkg -s unattended-upgrades"
plan = "builtin:unattended-upgrades:plan"
apply = "builtin:unattended-upgrades:apply"
rollback = "builtin:unattended-upgrades:rollback"
config = """
[plugins]
enabled = ["unattended-upgrades"]
"""

[[plugins]]
id = "dnf-automatic"
name = "dnf-automatic"
kind = "builtin"
summary = "Enables dnf automatic security updates without automatic reboots"
categories = ["updates", "hardening"]
requires = ["dnf"]
capabilities = ["security-updates"]
distros = ["almalinux", "rocky", "rhel", "fedora"]
probe = "rpm -q dnf-automatic"
plan = "builtin:dnf-automatic:plan"
apply = "builtin:dnf-automatic:apply"
rollback = "builtin:dnf-automatic:rollback"
config = """
[plugins]
enabled = ["dnf-automatic"]
"""

[[plugins]]
id = "sysctl-baseline"
name = "Kernel network baseline"
kind = "builtin"
summary = "Applies conservative VPS-safe network sysctl hardening"
categories = ["kernel", "network", "hardening"]
capabilities = ["sysctl"]
probe = "command -v sysctl"
plan = "builtin:sysctl-baseline:plan"
apply = "builtin:sysctl-baseline:apply"
rollback = "builtin:sysctl-baseline:rollback"
config = """
[plugins]
enabled = ["sysctl-baseline"]
"""

[[plugins]]
id = "web-profile"
name = "Web profile"
kind = "builtin"
summary = "Allows HTTP and HTTPS inbound traffic for web VPS workloads"
categories = ["profile", "firewall", "network"]
requires = ["firewall"]
capabilities = ["profile-web"]
probe = "true"
plan = "builtin:web-profile:plan"
apply = "builtin:web-profile:apply"
rollback = "builtin:web-profile:rollback"
config = """
[plugins]
enabled = ["web-profile"]
"""
