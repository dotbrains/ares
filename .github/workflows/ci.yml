name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: flox/install-flox-action@v2

      - name: Lint Markdown
        run: flox activate -c "make markdown"

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - name: Upload coverage
        uses: actions/upload-artifact@v5
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          if-no-files-found: error

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: make vet

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.2

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Smoke
        run: make smoke

  distro-smoke:
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - ubuntu-24.04
          - debian-12
          - debian-11
          - rocky-9
          - fedora
          - arch
          - opensuse-leap
          - alpine
          - oracle-9
          - amazon-2023
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Smoke ${{ matrix.fixture }}
        env:
          ARES_SMOKE_FIXTURES: ${{ matrix.fixture }}
        run: tests/smoke.sh

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Container integration
        run: make integration

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.16.0
          args: check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: flox/install-flox-action@v2

      - name: Run security checks
        run: flox activate -c "make security"

  flox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: flox/install-flox-action@v2

      - name: Run local CI in Flox
        run: flox activate -c "make ci"
