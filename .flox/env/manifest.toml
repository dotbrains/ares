schema-version = "1.13.0"

[install]
actionlint.pkg-path = "actionlint"
docker-client.pkg-path = "docker-client"
git.pkg-path = "git"
go.pkg-path = "go"
golangci-lint.pkg-path = "golangci-lint"
goreleaser.pkg-path = "goreleaser"
pre-commit.pkg-path = "pre-commit"
markdownlint-cli2.pkg-path = "markdownlint-cli2"
jq.pkg-path = "jq"
govulncheck.pkg-path = "govulncheck"
gitleaks.pkg-path = "gitleaks"
shellcheck.pkg-path = "shellcheck"

[vars]
ARES_FLOX = "1"

[hook]
on-activate = '''
  export PATH="$FLOX_ENV_PROJECT/bin:$PATH"
'''

[profile]
common = '''
  echo "ares dev environment ready: make ci"
'''

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-darwin",
  "x86_64-linux",
]
